<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newspeak Library — preview</title>
<style>

  :root{--bg:#f6f5f2;--panel:#fff;--ink:#191714;--muted:#6b6660;--line:#e4e0d8;--accent:#1d5c4a;--accent-soft:#e3efe9;--warn:#b45309;--star:#b45309;
    --avail:#16a34a;--borrowed:#d97706;--absent:#9ca3af;--missing:#dc2626;
    --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05)}
  @media(prefers-color-scheme:dark){:root{--bg:#141414;--panel:#1d1d1d;--ink:#f2efe9;--muted:#a39d94;--line:#2e2e2e;--accent:#7fd1b3;--accent-soft:#1f3b32;--warn:#fbbf24;--star:#fbbf24;--missing:#f87171;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  .skip{position:absolute;left:8px;top:-48px;z-index:100;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;text-decoration:none;transition:top .15s}
  .skip:focus{top:8px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  header{padding:24px 24px 10px;max-width:1400px;margin:0 auto}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .topbar>div:first-child{flex:1;min-width:0}
  h1{font:600 26px/1.2 ui-serif,Georgia,serif;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px}
  .auth{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 0;border-bottom:1px solid var(--line)}
  .tab{border:none;background:transparent;color:var(--muted);padding:9px 14px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:8px 8px 0 0}
  .tab .n{font-size:11px;opacity:.7;margin-left:5px}
  .tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
  .tab:hover{background:var(--accent-soft)}
  .tabsep{width:1px;height:18px;background:var(--line);align-self:center;margin:0 4px}
  .menubtn{display:none}
  .filters-toggle{display:none}
  .filterbar{display:contents}
  .listselect{display:none}
  .menu{position:absolute;right:16px;top:60px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:8px;z-index:20}
  .menu[hidden]{display:none}
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px;align-items:center}
  .controls input,.controls select{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:14px}
  .controls input{flex:1;min-width:200px}
  .sizes{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
  .sizes button{border:none;background:transparent;color:var(--muted);padding:8px 12px;cursor:pointer;font-size:13px;border-left:1px solid var(--line)}
  .sizes button.on{background:var(--accent);color:#fff}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 12px;font-size:13px;cursor:pointer}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .legend{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:4px 0 2px}
  .legend button{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;background:transparent;color:inherit;font:inherit;padding:3px 8px;border-radius:999px;cursor:pointer}
  .legend button:hover{background:var(--accent-soft)}
  .legend button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
  .dot[data-state=available]{background:var(--avail)}
  .dot[data-state=borrowed]{background:var(--borrowed)}
  .dot[data-state=absent]{background:var(--absent);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
  .dot[data-state=missing]{background:var(--missing)}
  .state-badge{position:absolute;top:8px;left:8px;z-index:2;display:inline-flex;align-items:center;gap:5px;max-width:calc(100% - 16px);padding:4px;border-radius:999px;background:rgba(255,255,255,.94);color:#191714;font-size:10.5px;font-weight:600;line-height:1.3;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.28)}
  .state-badge .dot{width:10px;height:10px}
  .state-badge .sb-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .state-badge:hover,.state-badge:focus-within{padding:3px 8px}
  .state-badge:hover .sb-label,.state-badge:focus-within .sb-label{position:static;width:auto;height:auto;padding:0;margin:0;overflow:hidden;clip:auto;white-space:nowrap;text-overflow:ellipsis}
  @media(prefers-color-scheme:dark){.state-badge{background:rgba(29,29,29,.94);color:#f2efe9}}
  .state-badge.inline{position:static;max-width:none;padding:3px 8px;background:var(--accent-soft);color:var(--ink);box-shadow:none;font-weight:500}
  .state-badge.inline .sb-label{position:static;width:auto;height:auto;padding:0;margin:0;overflow:visible;clip:auto}
  .size-s .state-badge{font-size:9.5px}
  .card-save{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;padding:0;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.94);color:#191714;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.28)}
  .card-save.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .card-save svg{width:16px;height:16px;display:block}
  @media(prefers-color-scheme:dark){.card-save{background:rgba(29,29,29,.94);color:#f2efe9}}
  .grid{display:grid;max-width:1400px;margin:12px auto 60px;padding:0 24px}
  .grid.size-s{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
  .grid.size-l{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px}
  .size-s .title{font-size:12.5px}.size-s .authors{font-size:11px}.size-s .cardbody{padding:9px 10px 11px}
  .size-l .title{font-size:16px}.size-l .authors{font-size:14px}.size-l .cardbody{padding:14px 15px 16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-3px)}
  .cover{aspect-ratio:2/3;background:linear-gradient(135deg,var(--accent-soft),var(--line));position:relative;overflow:hidden}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 34px/1 ui-serif,Georgia,serif;color:var(--accent);opacity:.65;padding:12px;text-align:center}
  .cardbody{padding:11px 12px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
  .title{font-weight:600;font-size:14px;line-height:1.3;margin:0}
  .title .cardlink{font:inherit;font-weight:600;color:inherit;text-align:left;background:none;border:none;padding:0;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%}
  .authors{color:var(--muted);font-size:12.5px;margin:0;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
  .pill.tag{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .pill.wish{background:#ede9fe;color:#7c3aed}
  .stars{color:var(--star);font-size:12px;letter-spacing:1px}
  .borrowline{font-size:11.5px;color:var(--warn)}
  .cardactions{margin-top:auto}
  .want,.savebtn,.borrowbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;min-height:28px;display:inline-flex;align-items:center;gap:4px}
  .want.voted,.savebtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:60px 0}
  dialog{border:none;border-radius:16px;padding:0;max-width:700px;width:92%;background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
  dialog::backdrop{background:rgba(0,0,0,.5)}
  .modal{position:relative;display:flex;gap:20px;padding:22px}
  .bookmenu{position:absolute;top:14px;right:14px;z-index:5}
  .bookmenu>summary{list-style:none;width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;line-height:1;box-shadow:var(--shadow)}
  .bookmenu>summary::-webkit-details-marker{display:none}
  .bookmenu>summary:hover,.bookmenu[open]>summary{background:var(--accent-soft)}
  .bookmenu .menu-list{position:absolute;top:38px;right:0;min-width:184px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px}
  .bookmenu .menu-list button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:8px 10px;border-radius:8px;cursor:pointer}
  .bookmenu .menu-list button:hover{background:var(--accent-soft)}
  .bookmenu .menu-list button svg{width:16px;height:16px;flex:0 0 auto}
  .bigcover{width:170px;flex:0 0 170px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--line);display:flex;align-items:center;justify-content:center}
  .bigcover img{width:100%;height:100%;object-fit:cover}
  .modal h2{font:600 20px/1.25 ui-serif,Georgia,serif;margin:0 0 6px}
  .meta{color:var(--muted);font-size:13px;margin-bottom:12px}
  .comment{border-top:1px solid var(--line);padding:10px 0 0;margin-top:10px;font-size:13.5px;white-space:pre-wrap}
  .comment .who{color:var(--muted);font-size:12px;margin-bottom:3px}
  .actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .bookactions{margin:12px 0}
  .olink{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--line)}
  .olink:hover{color:var(--accent);border-bottom-color:var(--accent)}
  .history{margin:12px 0;font-size:13px}
  .history summary{cursor:pointer;color:var(--muted)}
  .history ul{margin:6px 0 0;padding-left:18px}
  .history li{margin:2px 0}
  .history .now{color:var(--warn)}
  .member-box{border:1px dashed var(--line);border-radius:10px;padding:12px;margin-top:14px;background:var(--accent-soft)}
  .member-box h4{margin:0 0 8px;font-size:13px;color:var(--accent)}
  .member-box .section{padding:8px 0;border-top:1px solid var(--line)}
  .member-box .section:first-of-type{border-top:none;padding-top:0}
  .member-box.prompt{box-shadow:0 0 0 2px var(--accent)}
  .member-box .nudge{background:var(--accent);color:#fff;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}
  .rate{display:flex;gap:4px;font-size:24px;color:var(--line);user-select:none}
  .rate button{border:none;background:none;color:inherit;cursor:pointer;font:inherit;padding:0 2px;line-height:1;border-radius:4px}
  .rate button.on{color:var(--star)}
  input[type=text],input[type=password],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--panel);color:var(--ink)}
  textarea{min-height:56px}
  .controls select{width:auto}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  .tagrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .tagchip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 8px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
  .tagchip button{border:none;background:none;color:inherit;cursor:pointer;font-size:13px}
  .err{color:#b91c1c;font-size:13px;min-height:18px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f2430;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.28);z-index:80;max-width:90vw;text-align:center}
  @media(max-width:640px){
    .auth #me,.auth #addbook,.auth #authbtn{display:none}
    .menubtn{display:inline-block}
    h1{font-size:22px}
    .topbar h1 span{display:block}
    .tabs{display:none}
    .listselect{display:block;width:100%;margin:14px 0 0;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:15px}
    .filters-toggle{display:inline-block}
    .filterbar{display:none;width:100%;flex-wrap:wrap;gap:10px;align-items:center}
    .filterbar.open{display:flex}
    .grid.size-s{grid-template-columns:repeat(2,1fr);gap:12px}
    .grid.size-l{grid-template-columns:1fr;gap:20px}
    .modal{flex-direction:column}.bigcover{width:120px;flex-basis:auto}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.card:hover{transform:none}}

  /* Static-preview-only chrome; everything else comes from app/theme.py. */
  .banner{background:var(--accent-soft);color:var(--accent);font-size:12.5px;padding:6px 24px;text-align:center}
  .viewpill{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);cursor:pointer;background:var(--panel)}
  .viewpill.member{background:var(--accent);color:#fff;border-color:var(--accent)}
  body.view-public .member-only{display:none!important}
</style>
</head>
<body class="view-public">
<a class="skip" href="#grid">Skip to books</a>
<div class="banner" id="banner"></div>
<header>
  <div class="topbar">
    <div><h1><span>Newspeak</span> <span>Library</span></h1></div>
    <div class="auth">
      <span class="viewpill" id="viewpill" title="Toggle public / member view"></span>
      <span class="sub" id="me"></span>
      <button class="btn primary" id="addbook">＋ Add a book</button>
      <button class="btn" id="authbtn">Sign in</button>
      <button class="btn menubtn" id="menubtn" aria-label="Menu">☰</button>
    </div>
  </div>
  <div class="menu" id="menu" hidden>
    <button class="btn" id="menu-auth">Sign in</button>
    <button class="btn primary" id="menu-add">＋ Add a book</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Book lists"></nav>
  <select class="listselect" id="listselect" aria-label="Choose list"></select>
  <div class="controls">
    <label class="sr-only" for="q">Search books</label>
    <input id="q" type="search" placeholder="Search title, author, ISBN…">
    <button class="btn filters-toggle" id="filterbtn">Filters ▾</button>
    <div class="filterbar" id="filterbar">
      <select id="cat"><option value="">All categories</option></select>
      <select id="sort">
        <option value="random" selected>Sort: Random</option>
        <option value="title">Sort: Title</option>
        <option value="author">Sort: Author</option>
        <option value="year">Sort: Newest</option>
        <option value="rating">Sort: Rating</option>
      </select>
      <span class="sizes" id="sizes"><button data-size="s" class="on">S</button><button data-size="l">L</button></span>
      <span class="legend" id="legend" role="group" aria-label="Filter by status">
        <button data-state="available" aria-pressed="false"><i class="dot" data-state="available" aria-hidden="true"></i>In library</button>
        <button data-state="borrowed" aria-pressed="false"><i class="dot" data-state="borrowed" aria-hidden="true"></i>Borrowed</button>
        <button data-state="absent" aria-pressed="false"><i class="dot" data-state="absent" aria-hidden="true"></i>Not in library</button>
        <button data-state="missing" aria-pressed="false"><i class="dot" data-state="missing" aria-hidden="true"></i>Missing</button>
      </span>
    </div>
  </div>
</header>
<main class="grid" id="grid" tabindex="-1"></main>
<dialog id="dlg" aria-labelledby="mtitle"><div class="modal" id="modal"></div></dialog>
<dialog id="frm" aria-labelledby="ftitle"><div style="padding:22px" id="frmbody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

const store = {
  get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v===null?d:v}catch(e){return d}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v))}
};

const state={
  member:store.get('nh-member',''),

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials=t=>String(t==null?'?':t).replace(/[^\p{L}\p{N} ]/gu,'').split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const stars=v=>{const n=Math.round(v||0);return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n);};
const bookmarkSVG=on=>`<svg viewBox="0 0 24 24" aria-hidden="true" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>`;
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let order=shuffled(DATA.books);
let toastTimer=null;
function toast(msg,ms=6000){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,ms);}

// Mirror of the server's catalogue helpers, backed by localStorage.
function allBooks(){return DATA.books.map(b=>state.edits[b.id]?{...b,...state.edits[b.id]}:b).concat(state.added);}
function bookById(id){return allBooks().find(x=>x.id===id);}
function tabLists(){const l=lists.slice();if(state.member)l.push('Saved');return l;}
function isSaved(b){return (state.saves[b.id]||[]).includes(state.member);}
function isMissing(b){return !!state.missing[b.id];}
function hasList(b,l){return l==='All'||(b.lists||[]).includes(l);}
function inList(b,l){if(l==='All')return true;if(l==='Saved')return isSaved(b);return (b.lists||[]).includes(l);}
function loanOf(id){return state.loans[id]||null;}
function statusOf(b){
  if(isMissing(b))return {class:'missing',label:'Missing'};
  if(loanOf(b.id))return {class:'borrowed',label:'Borrowed'};
  const cur=hasList(b,'Current');
  return {class:cur?'available':'absent',label:cur?'In library':'Not in library'};
}
function borrowerOf(b){const l=loanOf(b.id);return l?l.borrower:(b.borrower||'');}
function wishCount(b){return (b.wishCount||0)+((state.votes[b.id]||[]).length);}
function ratingStats(b){
  const r=state.ratings[b.id]||{};
  const vals=Object.values(r).map(Number).filter(Boolean);
  const cnt=(b.ratingCount||0)+vals.length;
  const total=(b.avgRating||0)*(b.ratingCount||0)+vals.reduce((a,c)=>a+c,0);
  return {avg:cnt?Math.round((total/cnt)*100)/100:0,count:cnt,mine:r[state.member]||0};
}

// Local writes (the static stand-in for the app's POST endpoints).
function toggleSave(id){const a=state.saves[id]||[];state.saves[id]=a.includes(state.member)?a.filter(x=>x!==state.member):a.concat(state.member);store.set('nh-saves',state.saves);}
function setRating(id,n){state.ratings[id]=state.ratings[id]||{};state.ratings[id][state.member]=n;store.set('nh-ratings',state.ratings);}
function setMissing(id,on){if(on)state.missing[id]={reporter:state.member,since:new Date().toISOString().slice(0,10)};else delete state.missing[id];store.set('nh-missing',state.missing);}
function vote(id){if(!state.member)return;const v=state.votes[id]||[];if(v.includes(state.member))return;state.votes[id]=v.concat(state.member);store.set('nh-votes',state.votes);}
// Returns true when the action was a *return* (so the caller can prompt a review).
function toggleBorrow(id){
  const ret=!!state.loans[id];
  if(ret)delete state.loans[id];
  else{state.loans[id]={borrower:state.member,since:new Date().toISOString().slice(0,10)};if(state.missing[id]){delete state.missing[id];store.set('nh-missing',state.missing);}}
  store.set('nh-loans',state.loans);
  return ret;
}
function refreshAfter(id,review){
  render();
  const nb=bookById(id);
  if(nb)openBook(nb,true,review);
  if(review)toast('Returned — how was it? Add a rating or a note.');
}

function setSize(s){s=s==='l'?'l':'s';state.size=s;grid.className='grid size-'+s;document.querySelectorAll('#sizes button').forEach(b=>b.classList.toggle('on',b.dataset.size===s));store.set('nh-size',s);}
setSize(state.size);

  document.getElementById('addbook').style.display=member?'':'none';
  document.getElementById('menu-add').style.display=member?'':'none';

    ?'Prototype preview — <b>member view</b> (static demo: rate, review, borrow, vote; changes stay in this browser).'
    :'Prototype preview — <b>public view</b> (borrower names hidden).';
}

function renderTabs(){
  const tabs=document.getElementById('tabs'); tabs.innerHTML='';
  const sel=document.getElementById('listselect'); sel.innerHTML='';
  for(const l of tabLists()){
    const n=allBooks().filter(b=>inList(b,l)).length;
    if(l==='Saved'){const sep=document.createElement('span');sep.className='tabsep';tabs.append(sep);}
    const btn=document.createElement('button'); btn.className='tab'+(state.list===l?' on':'');
    if(state.list===l)btn.setAttribute('aria-current','true');
    btn.innerHTML=`${esc(l)}<span class="n">${n}</span>`;
    btn.onclick=()=>{state.list=l;store.set('nh-list',l);render();}; tabs.append(btn);
    const opt=new Option(`${l}  (${n})`,l); opt.selected=state.list===l; sel.append(opt);
  }
}

function render(){
  if(cat.options.length<=1)[...new Set(allBooks().map(b=>b.category).filter(Boolean))].sort().forEach(c=>cat.append(new Option(c,c)));
  renderTabs();
  const term=q.value.trim().toLowerCase();
  let rows=allBooks().filter(b=>{
    if(!inList(b,state.list))return false;
    if(state.status&&statusOf(b).class!==state.status)return false;
    if(cat.value&&b.category!==cat.value)return false;
    if(!term)return true;
    return (b.title+' '+b.authors+' '+b.isbn+' '+(b.tags||[]).join(' ')).toLowerCase().includes(term);
  });
  if(sort.value==='random'){const pos=new Map(order.map((id,i)=>[id,i]));rows.sort((a,b)=>(pos.get(a.id)??1e9)-(pos.get(b.id)??1e9));}
  else if(sort.value==='rating')rows.sort((a,b)=>ratingStats(b).avg-ratingStats(a).avg);
  else rows.sort((a,b)=>sort.value==='year'?(b.year||0)-(a.year||0):(a[sort.value==='author'?'authors':'title']||'').localeCompare(b[sort.value==='author'?'authors':'title']||''));
  grid.innerHTML=rows.length?'':'<div class="empty">Nothing here yet.</div>';
  for(const b of rows){
    const el=document.createElement('article'); el.className='card';
    const isWish=(b.lists||[]).includes('Wish list');
    const voted=(state.votes[b.id]||[]).includes(state.member);
    const saved=isSaved(b), st=statusOf(b), rs=ratingStats(b);
    el.innerHTML=`
      <div class="cover">${b.cover?`<img loading="lazy" src="${b.cover}" alt="" onerror="this.style.display='none'">`:''}<div class="fallback">${initials(b.title)}</div>
        <span class="state-badge" data-state="${st.class}"><i class="dot" data-state="${st.class}" aria-hidden="true"></i><span class="sb-label">${st.label}</span></span>
        ${state.member?`<button class="card-save member-only ${saved?'on':''}" title="${saved?'Remove from saved':'Save book'}" aria-label="${saved?'Remove from saved':'Save book'}" aria-pressed="${saved?'true':'false'}">${bookmarkSVG(saved)}</button>`:''}</div>
      <div class="cardbody">
        <p class="title"><button class="cardlink">${esc(b.title)}<span class="sr-only"> — view details</span></button></p>
        <p class="authors">${esc(b.authors||'Unknown author')}</p>
        <div class="row">
          ${b.category?`<span class="pill">${esc(b.category)}</span>`:''}
          ${(b.tags||[]).slice(0,3).map(t=>`<span class="pill tag">${esc(t)}</span>`).join('')}
          ${rs.count?`<span class="stars" aria-hidden="true">${stars(rs.avg)}</span><span class="sr-only">Rated ${rs.avg} out of 5 from ${rs.count} rating(s)</span>`:''}
        </div>
        ${borrowerOf(b)?`<div class="borrowline member-only">Borrowed by ${esc(borrowerOf(b))}</div>`:''}
        <div class="row cardactions">
          ${isWish?`<button class="want ${voted?'voted':''}" ${voted?'disabled':''}>${voted?'✓ ':''}${wishCount(b)} want it</button>`:''}
          ${state.member&&hasList(b,'Current')?`<button class="borrowbtn member-only">${st.class==='borrowed'?'↩ Return':'📖 Borrow'}</button>`:''}
        </div>
      </div>`;
    el.onclick=e=>{if(e.target.closest('.want,.card-save,.borrowbtn'))return; openBook(b);};
    const w=el.querySelector('.want'); if(w)w.onclick=e=>{e.stopPropagation();if(!state.member){openLogin();return;}vote(b.id);render();};
    const bb=el.querySelector('.borrowbtn'); if(bb)bb.onclick=e=>{e.stopPropagation();const ret=toggleBorrow(b.id);if(ret)refreshAfter(b.id,true);else render();};
    const sv=el.querySelector('.card-save'); if(sv)sv.onclick=e=>{e.stopPropagation();toggleSave(b.id);render();};
    grid.append(el);
  }
}

      <div class="actions bookactions member-only">
        ${hasList(b,'Current')?`<button class="btn primary" id="mborrow">${st.class==='borrowed'?'↩ Mark returned':'📖 Borrow'}</button>`:''}
        ${isWish?`<button class="btn" id="mvote">${voted?'✓ you want it':'＋ I want it too'}</button>`:''}
      </div>
      <div class="member-box member-only${review?' prompt':''}">
        ${review?`<div class="nudge" role="status">Returned — how was it? Add a rating or a note.</div>`:''}
        <div class="section"><h4>Your rating</h4><div class="rate" id="rate" role="group" aria-label="Your rating">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" class="${n<=mine?'on':''}" aria-label="${n} star${n>1?'s':''}" aria-pressed="${n<=mine?'true':'false'}">★</button>`).join('')}</div></div>
        <div class="section"><h4>Add a comment</h4><textarea id="ctext" placeholder="…"></textarea><div class="actions"><button class="btn primary" id="postc">Post comment</button></div></div>
      </div>
    </div>`;
  modal.querySelectorAll('#rate button').forEach(s=>s.onclick=()=>{
    const n=+s.dataset.n; setRating(b.id,n); refreshAfter(b.id);
  });
  const mb=modal.querySelector('#mborrow'); if(mb)mb.onclick=()=>{const ret=toggleBorrow(b.id);refreshAfter(b.id,ret);};
  const mm=modal.querySelector('#mmissing'); if(mm)mm.onclick=()=>{setMissing(b.id,st.class!=='missing');refreshAfter(b.id);};
  const ms=modal.querySelector('#msave'); if(ms)ms.onclick=()=>{toggleSave(b.id);refreshAfter(b.id);};
  const mv=modal.querySelector('#mvote'); if(mv)mv.onclick=()=>{vote(b.id);refreshAfter(b.id);};
  const meb=modal.querySelector('#medit'); if(meb)meb.onclick=()=>{const d=modal.querySelector('.bookmenu');if(d)d.open=false;openEditBook(b);};
  const pc=modal.querySelector('#postc'); if(pc)pc.onclick=()=>{const t=modal.querySelector('#ctext').value.trim();if(!t)return;
    state.reviews[b.id]=(state.reviews[b.id]||[]).concat([{person:state.member,text:t,date:new Date().toISOString().slice(0,10)}]);store.set('nh-reviews',state.reviews);refreshAfter(b.id);};
  if(!keep)dlg.showModal();
  if(review){const box=modal.querySelector('.member-box');if(box)box.scrollIntoView({block:'nearest'});}
}

function openLogin(){
  const remembered=state.member||'';
  frmbody.innerHTML=`
    <h2 id="ftitle" style="font:600 18px/1.3 ui-serif,Georgia,serif;margin:0 0 12px">Sign in</h2>
    <p class="sub" style="margin:0 0 12px">Static demo — enter your name; any password works. Changes stay in this browser.</p>
    <div class="field"><label for="u">Your name</label><input type="text" id="u" autocomplete="off" placeholder="Your name" value="${esc(remembered)}"></div>
    <div class="field"><label for="p">Password</label><input type="password" id="p"></div>
    <div class="err" id="err" role="alert"></div>
    <div class="actions"><button class="btn primary" id="dologin">Sign in</button><button class="btn" id="cancel">Cancel</button></div>`;
  frmbody.querySelector('#cancel').onclick=()=>frm.close();
  const go=()=>{const name=frmbody.querySelector('#u').value.trim();if(!name){frmbody.querySelector('#err').textContent='Enter your name';return;}
    state.member=name;state.view='member';store.set('nh-member',name);store.set('nh-view','member');frm.close();applyView();render();};
  frmbody.querySelector('#dologin').onclick=go;
  frmbody.querySelector('#p').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  if(!remembered)frmbody.querySelector('#u').focus();else frmbody.querySelector('#p').focus();
  frm.showModal();
}
function doAuth(){if(state.member){state.member='';store.set('nh-member','');state.view='public';store.set('nh-view','public');applyView();render();}else openLogin();}

function openAddBook(){
  frmbody.innerHTML=`
    <h2 id="ftitle" style="font:600 18px/1.3 ui-serif,Georgia,serif;margin:0 0 6px">Add a book to the wish list</h2>
    <p class="sub" style="margin:0 0 14px">Others can “＋” it; the count disappears once it leaves the wish list. (Static demo — saved in this browser.)</p>
    <div class="field"><label for="t">Title</label><input type="text" id="t"></div>
    <div class="field"><label for="a">Author(s)</label><input type="text" id="a"></div>
    <div class="field"><label for="i">ISBN (optional)</label><input type="text" id="i"></div>
    <div class="err" id="err" role="alert"></div>
    <div class="actions"><button class="btn primary" id="save">Add to wish list</button><button class="btn" id="cancel">Cancel</button></div>`;
  frmbody.querySelector('#cancel').onclick=()=>frm.close();
  frmbody.querySelector('#save').onclick=()=>{
    const title=frmbody.querySelector('#t').value.trim();if(!title){frmbody.querySelector('#err').textContent='Title required';return;}
    const b={id:'NEW'+Date.now(),title,authors:frmbody.querySelector('#a').value.trim(),isbn:frmbody.querySelector('#i').value.trim(),
      category:'',tags:[],collection:'',lists:['Wish list'],status:'Available',missing:false,borrower:'',avgRating:0,ratingCount:0,wishCount:0,reviews:[]};
    state.added.push(b);store.set('nh-added',state.added);
    state.votes[b.id]=[state.member];store.set('nh-votes',state.votes);
    state.list='Wish list';store.set('nh-list','Wish list');frm.close();render();
  };
  frm.showModal();
}
function openEditBook(b){
  frmbody.innerHTML=`
    <h2 id="ftitle" style="font:600 18px/1.3 ui-serif,Georgia,serif;margin:0 0 6px">Edit book details</h2>
    <p class="sub" style="margin:0 0 14px">Fix the title, author or ISBN. (Static demo — saved in this browser.)</p>
    <div class="field"><label for="et">Title</label><input type="text" id="et" value="${esc(b.title)}"></div>
    <div class="field"><label for="ea">Author(s)</label><input type="text" id="ea" value="${esc(b.authors||'')}"></div>
    <div class="field"><label for="ei">ISBN</label><input type="text" id="ei" value="${esc(b.isbn||'')}"></div>
    <div class="err" id="err" role="alert"></div>
    <div class="actions"><button class="btn primary" id="esave">Save</button><button class="btn" id="ecancel">Cancel</button></div>`;
  frmbody.querySelector('#ecancel').onclick=()=>frm.close();
  frmbody.querySelector('#esave').onclick=()=>{
    const t=frmbody.querySelector('#et').value.trim();if(!t){frmbody.querySelector('#err').textContent='Title required';return;}
    const a=frmbody.querySelector('#ea').value.trim(), i=frmbody.querySelector('#ei').value.trim();
    if(state.added.some(x=>x.id===b.id)){state.added=state.added.map(x=>x.id===b.id?{...x,title:t,authors:a,isbn:i}:x);store.set('nh-added',state.added);}
    else{state.edits[b.id]={title:t,authors:a,isbn:i};store.set('nh-edits',state.edits);}
    frm.close();refreshAfter(b.id);
  };
  frm.showModal();
  frmbody.querySelector('#et').focus();
}

document.getElementById('authbtn').onclick=doAuth;
document.getElementById('addbook').onclick=openAddBook;
document.getElementById('menubtn').onclick=e=>{e.stopPropagation();const m=document.getElementById('menu');m.hidden=!m.hidden;};
document.getElementById('menu-auth').onclick=()=>{document.getElementById('menu').hidden=true;doAuth();};
document.getElementById('menu-add').onclick=()=>{document.getElementById('menu').hidden=true;openAddBook();};
document.getElementById('filterbtn').onclick=()=>{document.getElementById('filterbar').classList.toggle('open');};
document.getElementById('listselect').addEventListener('change',e=>{state.list=e.target.value;render();});
document.getElementById('viewpill').onclick=()=>{state.view=state.view==='member'?'public':'member';store.set('nh-view',state.view);applyView();render();};
document.addEventListener('click',e=>{const m=document.getElementById('menu');if(!m.hidden&&!e.target.closest('#menu,#menubtn'))m.hidden=true;
  modal.querySelectorAll('details.bookmenu[open]').forEach(d=>{if(!e.target.closest('.bookmenu'))d.open=false;});});
document.querySelectorAll('#sizes button').forEach(b=>b.addEventListener('click',()=>setSize(b.dataset.size)));
const legend=document.getElementById('legend');
legend.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{
  state.status=state.status===btn.dataset.state?null:btn.dataset.state;
  legend.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.state===state.status?'true':'false'));
  render();
}));
[q,cat,sort].forEach(e=>e.addEventListener('input',render));
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});
frm.addEventListener('click',e=>{if(e.target===frm)frm.close();});
applyView();
render();
</script>
</body>
</html>
